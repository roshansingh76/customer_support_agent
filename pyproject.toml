[project]
name = "customer-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roshan Singh", email = "roshansingh9450@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.162.2",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langgraph>=1.2.24",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pypdf>=7.1.1",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.0.57",
    "unicorn>=2.1.4",
]

[project.scripts]
customer_support = "customer_support.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
